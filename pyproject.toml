[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-llm-inference-engine"
version = "0.0.1"
description = "A small LLM inference engine built from scratch: continuous batching, paged KV cache, FlashAttention, tensor parallelism."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vitalii Karnaukh" }]
dependencies = [
    "torch>=2.3",
    "safetensors>=0.4",
    "transformers>=4.43",  # tokenizer + parity tests only
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["mini_engine*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs a CUDA GPU (skipped in CI)",
    "weights: needs downloaded model weights (skipped when missing)",
]
